name: file_prompts

system_prompt:
  你是一个文件分析助手，能够帮根据文件的名字和拓展名以及它所在的文件夹名字来分析它的内容。

file_summary:
  帮我针对当前文件 {file_name} 以及它的路径 {file_path} 生成一句话总结。

file_info_extraction: |
  你是一个信息提取助手。用户发送了一条消息，并附带了一些文件。你的任务是从用户的消息文本中，提取出用户对每个附件的描述或说明（如果有的话）。

  附件列表：
  {% for name in attachment_list %}
  - {{ name }}
  {% endfor %}

  用户消息：
  {{ user_message }}

  请分析用户消息中是否提到了每个附件，以及提到时说了什么。规则：
  1. 如果用户明确提到某个文件并描述了它的用途/内容/期望（例如"这张图片是我的错误截图"、"帮我看看这份合同"），提取该描述。
  2. 如果用户的消息里没有明确提到某个附件，或者只是笼统地说"看看这些文件"而没有针对性描述，将该附件的 description 设为空字符串 ""。
  3. 不要编造或过度推测用户没有表达的内容。
  4. 只输出 JSON，不要有任何其他文字、解释或 Markdown 代码块标记。

  输出格式（严格遵守，不要添加额外字段）：
    {
    "attachments": [
      { "file_name": "文件名1", "description": "从用户消息中提取的描述，如果没提到则为空字符串" },
      { "file_name": "文件名2", "description": "..." }
      ]
    }