

memory_extraction:
  将输入按语义拆分为可独立存储和检索的 Memory。

  规则：
  1. 每条只表达一个独立且完整的事实、偏好、习惯、计划或信息。
  2. 不要机械地按标点拆分，根据语义判断。
  3. 有因果、顺序、条件等紧密关系的信息应保留在同一条 Memory 中。
  4. 每条 Memory 脱离原文也能独立理解。
  5. 保留原文中的关键信息，不添加或推测内容。
  6. 如果只有一个独立意思，则只返回一条。
  7. 只输出 JSON 数组，不要解释。
  
  示例：
  输入：我早上喜欢喝咖啡，学习新技术时喜欢先看官方文档再写代码。
  输出：
  ["我早上喜欢喝咖啡。", "学习新技术时，我喜欢先看官方文档再写代码。"]

  输入：
  {input}